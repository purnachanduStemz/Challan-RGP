<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password · Delivery Challan cum Gate Pass</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width:420px;">
    <a href="dashboard.html" id="backLink" style="font-size:13px;">&larr; Back</a>
    <h1>Change Password with Email OTP</h1>
    <div id="errorArea"></div>
    <div id="successArea"></div>

    <form id="changePasswordForm" class="card">
      <div id="emailSection">
        <label for="email">Email *</label>
        <input type="email" id="email" required autocomplete="username" placeholder="you@company.com">
      </div>

      <div id="otpSection">
        <button type="button" id="sendOtpBtn" class="btn btn-primary" style="width:100%; margin-top:12px;">Send OTP to this email</button>
        <label>OTP *</label>
        <input type="text" id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
        <p class="section-note">An OTP will be sent to the email address used for login.</p>
        <button type="button" id="verifyOtpBtn" class="btn btn-primary" style="width:100%; margin-top:12px;">Verify OTP</button>
      </div>

      <div id="newPasswordSection" style="display:none;">
        <label>New Password *</label>
        <input type="password" id="new_password" minlength="8" autocomplete="new-password">
        <p class="section-note">At least 8 characters.</p>

        <label>Re-enter New Password *</label>
        <input type="password" id="confirm_password" minlength="8" autocomplete="new-password">

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Change Password</button>
      </div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/change-password.js?v=3"></script>
</body>
</html>
