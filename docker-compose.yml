version: '3.8'
services:
  db:
    image: postgres:15
    container_name: challan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: challan_app
      POSTGRES_PASSWORD: challan_pass
      POSTGRES_DB: challan_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challan_app -d challan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
